<ul class="mobile-submenu">
    {% for sub in current_categories %}
        {% if sub.is_active %}
            <li>
                <a href="{% url 'marketplace:home' %}?category={{ sub.id }}{% if item_type %}&item_type={{ item_type }}{% endif %}">
                    - {{ sub.name }}
                </a>
                {% if sub.subcategories.all %}
                    {% include 'partials/category_menu_node.html' with current_categories=sub.subcategories.all item_type=item_type %}
                {% endif %}
            </li>
        {% endif %}
    {% endfor %}
</ul>
