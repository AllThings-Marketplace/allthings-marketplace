{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="feedback-wrapper mt-40 mb-40">
    <div class="summary-card">
        <h2 class="section-heading mt-0">Upload images for {{ product.name }}</h2>
        <p class="section-subtitle">Select up to 8 images. Our system will automatically remove the background and standardize them for the marketplace.</p>

        <!-- THE FIX: Added 'dashboard:' to the url namespace -->
        <form method="POST" enctype="multipart/form-data" action="{% url 'dashboard:upload_product_images' product.id %}" class="mt-20">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label-dark">Select Product Photos</label>
                <input type="file" name="images" class="form-control" accept="image/png, image/jpeg, image/webp" multiple required>
            </div>
            
            <button type="submit" class="action-btn btn-primary w-100 mt-20 py-15 text-16">
                <i class="fa-solid fa-cloud-arrow-up icon-spaced"></i> Upload and Optimize
            </button>
        </form>
    </div>
</div>
{% endblock %}
