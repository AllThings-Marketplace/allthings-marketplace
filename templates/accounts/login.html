{% extends 'base.html' %}
{% load socialaccount %} <!-- Required to generate secure OAuth URLs -->

{% block content %}
<div class="login-wrapper animate-fade-in">
    <div class="summary-card">
        <h2 class="text-center mt-0 font-600-dark text-24">Welcome Back</h2>
        
        <form method="POST" class="django-form mt-20">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="action-btn btn-primary w-100 mt-15 py-15 text-16">
                Log In
            </button>
        </form>

        <!-- Premium Divider -->
        <div class="auth-divider">
            <span>Or continue with</span>
        </div>

        <!-- Social Auth Grid -->
        <div class="social-auth-grid">
            <form action="{% provider_login_url 'google' %}" method="post" class="w-100">
                {% csrf_token %}
                <button type="submit" class="btn-social btn-google w-100">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>
            </form>
        </div>
        
        <p class="text-center mt-25 text-14-muted">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="text-blue font-600-dark no-underline">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
